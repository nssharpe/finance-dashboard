name: no-secrets

# Belt and braces on top of .gitignore: fail the build if anything that looks
# like personal financial data or a SimpleFIN credential gets committed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed data files and credentials
        run: |
          set -e
          bad=$(git ls-files \
            | grep -Ei '(^|/)(finance\.db|config\.json|accounts\.local\.json)$|^app/rules_local\.py$|\.(xlsx|xls|ofx|qfx|pdf)$|\.csv$' \
            | grep -v '^tests/fixtures/' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must never be committed:"; echo "$bad"; exit 1
          fi
          if git grep -qIE 'simplefin\.org/(access|[A-Za-z0-9]{20,})' -- . ':!*.md' ':!.github'; then
            echo "::error::A SimpleFIN access URL appears to be committed."; exit 1
          fi
          echo "Clean."
